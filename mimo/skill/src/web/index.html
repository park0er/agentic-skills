<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMo AB 评测</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --surface: #1e1e3a; --border: #2a2a4a;
  --text: #e0e0e0; --text-dim: #a0a0b0; --text-muted: #6c6c80;
  --accent: #7c5cfc; --accent-hover: #9b7fff;
  --green: #51cf66; --red: #ff6b6b; --yellow: #ffd43b;
  --a-accent: #58a6ff; --b-accent: #d2a8ff;
  --font: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --radius: 8px;
}
html, body { height: 100%; font-family: var(--font-ui); background: var(--bg); color: var(--text); }
#app { display: flex; flex-direction: column; height: 100vh; }

/* ─── Header ─────────────────────────────────────────────────────────── */
header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: var(--bg2); }
header h1 { font-size: 16px; font-weight: 600; color: var(--accent); font-family: var(--font); }
.header-info { display: flex; gap: 16px; font-size: 13px; color: var(--text-dim); align-items: center; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-dot.connected { background: var(--green); }
.status-dot.disconnected { background: var(--red); }

/* ─── Columns ────────────────────────────────────────────────────────── */
.columns { flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.column { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
.column:last-child { border-right: none; }
.col-header { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); display: flex; justify-content: space-between; align-items: center; }
.column:first-child .col-header { border-left: 3px solid var(--a-accent); }
.column:last-child .col-header { border-left: 3px solid var(--b-accent); }
.col-header .model-name { font-size: 14px; font-weight: 600; font-family: var(--font); }
.column:first-child .col-header .model-name { color: var(--a-accent); }
.column:last-child .col-header .model-name { color: var(--b-accent); }
.col-header .session-info { font-size: 11px; color: var(--text-muted); font-family: var(--font); }
.col-stats { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; }
.col-stats span { display: flex; align-items: center; gap: 4px; }

/* ─── Messages ───────────────────────────────────────────────────────── */
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* User message */
.msg-user { align-self: flex-end; max-width: 85%; animation: fadeIn 0.2s ease; }
.msg-user .bubble { background: var(--accent); color: #fff; border-radius: var(--radius); border-bottom-right-radius: 2px; padding: 10px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg-user .label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }

/* User long output */
.msg-user .user-preview { font-size: 13px; opacity: 0.8; }
.msg-user .user-toggle { display: inline-block; margin-top: 6px; font-size: 12px; color: rgba(255,255,255,0.6); cursor: pointer; text-decoration: underline; }
.msg-user .user-full-output { display: none; margin-top: 8px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px; font-family: var(--font); font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.msg-user .user-full-output.open { display: block; }

/* Assistant message */
.msg-assistant { align-self: flex-start; max-width: 85%; animation: fadeIn 0.2s ease; }
.msg-assistant .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); border-bottom-left-radius: 2px; padding: 12px 16px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.msg-assistant .bubble.hidden { display: none; }

/* Thinking block */
.thinking-block { color: var(--text-muted); font-style: italic; font-size: 12px; padding: 8px 12px; border-left: 3px solid var(--text-muted); margin: 6px 0; background: rgba(255,255,255,0.02); border-radius: 0 var(--radius) var(--radius) 0; cursor: pointer; max-height: 60px; overflow: hidden; transition: max-height 0.3s ease; position: relative; }
.thinking-block.expanded { max-height: 5000px; }
.thinking-block::before { content: "💭 思考过程（点击展开）"; display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-style: normal; font-weight: 600; }
.thinking-block::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 20px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
.thinking-block.expanded::after { display: none; }

/* Text block */
.text-block { padding: 4px 0; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
.text-block.error { color: var(--red); background: rgba(255,107,107,0.1); border-radius: var(--radius); padding: 10px 14px; margin: 4px 0; border-left: 3px solid var(--red); }
/* Markdown-rendered text */
.text-block.md { white-space: normal; }
.text-block.md h1, .text-block.md h2, .text-block.md h3 { line-height: 1.3; margin: 10px 0 6px; font-weight: 600; }
.text-block.md h1 { font-size: 18px; } .text-block.md h2 { font-size: 16px; } .text-block.md h3 { font-size: 14px; color: var(--text-dim); }
.text-block.md p { margin: 6px 0; }
.text-block.md ul, .text-block.md ol { margin: 6px 0; padding-left: 22px; }
.text-block.md li { margin: 2px 0; }
.text-block.md code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; font-family: var(--font); font-size: 12px; }
.text-block.md pre { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
.text-block.md pre code { background: none; padding: 0; font-size: 12px; line-height: 1.5; display: block; white-space: pre; }
.text-block.md a { color: var(--accent); text-decoration: underline; }
.text-block.md blockquote { border-left: 3px solid var(--border); margin: 6px 0; padding: 2px 0 2px 12px; color: var(--text-dim); }
.text-block.md strong { font-weight: 600; color: var(--text); }
.text-block.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.text-block.md th, .text-block.md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.text-block.md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

/* Tool call */
.tool-call { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin: 6px 0; overflow: hidden; }
.tool-header { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; min-width: 0; }
.tool-header:hover { background: rgba(124, 92, 252, 0.1); }
.tool-name { font-weight: 600; color: var(--yellow); font-family: var(--font); font-size: 13px; flex-shrink: 0; }
.tool-args { color: var(--text-dim); font-family: var(--font); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tool-body { display: none; padding: 10px 12px; border-top: 1px solid var(--border); font-family: var(--font); font-size: 12px; color: var(--text-dim); max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.tool-call.expanded .tool-body { display: block; }
.tool-result { font-size: 12px; padding: 6px 12px; border-top: 1px solid var(--border); font-family: var(--font); max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
.tool-result.pending { color: var(--text-muted); }
.tool-result.success { color: var(--green); }
.tool-result.error { color: var(--red); }
.tool-result-content { display: none; margin-top: 4px; padding: 6px; background: rgba(0,0,0,0.2); border-radius: 4px; font-size: 11px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
.tool-result.expanded .tool-result-content { display: block; }
.tool-result-toggle { cursor: pointer; color: var(--text-dim); text-decoration: underline; font-size: 11px; }

/* Result footer */
.result-footer { font-size: 11px; color: var(--text-muted); padding: 6px 0 0; border-top: 1px solid var(--border); margin-top: 8px; display: flex; gap: 12px; }

/* JSON syntax highlighting */
.json-key { color: var(--yellow); }
.json-string { color: var(--green); }
.json-number { color: var(--a-accent); }
.json-boolean { color: var(--b-accent); }
.json-null { color: var(--text-muted); }

/* Waiting spinner */
.waiting { color: var(--text-muted); font-size: 13px; padding: 8px 0; display: flex; align-items: center; gap: 8px; }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* System message */
.system-msg { color: var(--text-muted); font-size: 12px; text-align: center; padding: 8px; font-style: italic; }

/* Command result (styled assistant bubble) */
.cmd-result { align-self: flex-start; max-width: 85%; animation: fadeIn 0.2s ease; }
.cmd-result .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); border-bottom-left-radius: 2px; padding: 12px 16px; font-size: 13px; line-height: 1.8; }
.cmd-result .bubble .cmd-header { font-size: 12px; color: var(--accent); font-weight: 600; font-family: var(--font); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.cmd-result .bubble .cmd-label { color: var(--text-dim); }
.cmd-result .bubble .cmd-value { color: var(--text); font-weight: 600; }
.cmd-result .bubble .cmd-key { color: var(--accent); font-family: var(--font); }
.cmd-result .bubble .cmd-row { display: flex; justify-content: space-between; padding: 3px 0; }
.cmd-result .bubble .cmd-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.cmd-result .bubble .cmd-kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; font-size: 11px; font-family: var(--font); color: var(--text-dim); }

/* Per-column status bar */
.col-status-bar { padding: 4px 16px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); font-size: 11px; font-family: var(--font); color: var(--text-muted); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.col-status-bar .cs-model { color: var(--accent); font-weight: 600; }
.col-status-bar .cs-session { opacity: 0.7; }
.col-status-bar .cs-stat { display: flex; align-items: center; gap: 3px; }

/* ─── Input Area ─────────────────────────────────────────────────────── */
.input-area { padding: 12px 20px; border-top: 1px solid var(--border); flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--bg2); }
.input-col { display: flex; flex-direction: column; gap: 8px; }
.input-row { display: flex; gap: 8px; }
.input-wrapper textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; color: var(--text); font-size: 14px; font-family: var(--font-ui); resize: none; outline: none; min-height: 42px; max-height: 120px; transition: border-color 0.15s; width: 100%; }
.input-wrapper textarea:focus { border-color: var(--accent); }
.input-col:first-child .input-wrapper textarea:focus { border-color: var(--a-accent); }
.input-col:last-child .input-wrapper textarea:focus { border-color: var(--b-accent); }
.send-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 0 20px; font-size: 14px; cursor: pointer; font-weight: 600; transition: background 0.15s; }
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.input-col:first-child .send-btn { background: var(--a-accent); }
.input-col:last-child .send-btn { background: var(--b-accent); }

/* ─── Bottom Bar ─────────────────────────────────────────────────────── */
.bottom-bar { padding: 8px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: var(--bg2); }
.bottom-bar .left { display: flex; gap: 8px; align-items: center; }
#send-both-btn { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 6px 16px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
#send-both-btn:hover { background: var(--accent-hover); }
#send-both-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.turn-info { color: var(--text-muted); font-size: 12px; }
#end-btn { background: transparent; color: var(--red); border: 1px solid var(--red); border-radius: var(--radius); padding: 6px 16px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
#end-btn:hover { background: var(--red); color: #fff; }

/* ─── Sidebar (History Panel) ──────────────────────────────────────── */
#app { flex-direction: row; }
.sidebar { width: 0; overflow: hidden; background: var(--bg); border-right: 1px solid var(--border); flex-shrink: 0; transition: width 0.2s ease; display: flex; flex-direction: column; }
.sidebar.open { width: 260px; }
.sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
.sidebar-header .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
.sidebar-header .close-btn:hover { color: var(--text); }
.history-list { flex: 1; overflow-y: auto; padding: 8px; }
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.history-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; transition: all 0.15s; }
.history-item:hover { background: var(--surface); border-color: var(--border); }
.history-item.active { background: var(--surface); border-color: var(--accent); }
.history-item .hi-task { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item .hi-models { font-size: 11px; color: var(--text-dim); font-family: var(--font); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-item .hi-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.history-item .hi-label { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
.history-item .hi-label.current { background: var(--accent); color: #fff; }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-toggle { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; transition: all 0.15s; }
.sidebar-toggle:hover { background: var(--surface); color: var(--text); }

/* ─── Shortcut Bar ─────────────────────────────────────────────────── */
.shortcut-bar { padding: 0 20px; border-top: 1px solid var(--border); background: var(--bg); display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11px; color: var(--text-muted); flex-shrink: 0; overflow: hidden; max-height: 0; transition: max-height 0.2s ease, padding 0.2s ease; }
.shortcut-bar.open { max-height: 120px; padding: 8px 20px; }
.shortcut-bar span { white-space: nowrap; }
.shortcut-bar kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: var(--font); color: var(--text-dim); }
.shortcut-toggle { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; padding: 2px 6px; }
.shortcut-toggle:hover { color: var(--text-dim); }

/* ─── Autocomplete Dropdown ───────────────────────────────────────── */
.autocomplete-dropdown { position: absolute; bottom: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-height: 240px; overflow-y: auto; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.4); margin-bottom: 4px; }
.autocomplete-dropdown.hidden { display: none; }
.autocomplete-item { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; transition: background 0.1s; }
.autocomplete-item:hover, .autocomplete-item.selected { background: rgba(124, 92, 252, 0.15); }
.autocomplete-item .ac-icon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
.autocomplete-item .ac-cmd { color: var(--accent); font-family: var(--font); font-weight: 600; }
.autocomplete-item .ac-desc { color: var(--text-muted); font-size: 12px; margin-left: auto; }
.autocomplete-item mark { background: rgba(124, 92, 252, 0.3); color: var(--text); border-radius: 2px; padding: 0 1px; }
.input-wrapper { position: relative; flex: 1; display: flex; }
.input-wrapper textarea { flex: 1; }

/* ─── Tool Icon ────────────────────────────────────────────────────── */
.tool-icon { font-size: 14px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>📋 历史记录</span>
    <button class="close-btn" onclick="toggleSidebar()">&times;</button>
  </div>
  <div class="history-list" id="history-list">
    <div style="color: var(--text-muted); font-size: 12px; padding: 16px; text-align: center;">加载中...</div>
  </div>
</div>
<div class="main-area">
<header>
  <div style="display:flex; align-items:center; gap:8px;">
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="历史记录 (Ctrl+H)">☰</button>
    <h1>MiMo AB 评测</h1>
  </div>
  <div class="header-info">
    <span><span class="status-dot" id="status-dot"></span> <span id="status-text">连接中...</span></span>
    <span id="timer">00:00</span>
    <button class="shortcut-toggle" onclick="toggleShortcuts()" title="快捷键">⌨</button>
  </div>
</header>

<div class="columns">
  <div class="column" id="col-a">
    <div class="col-header">
      <div>
        <div class="model-name" id="label-a">模型 A</div>
        <div class="session-info" id="session-a"></div>
      </div>
      <div class="col-stats" id="stats-a"></div>
    </div>
    <div class="messages" id="messages-a"></div>
    <div class="col-status-bar" id="status-bar-a">
      <span class="cs-model" id="cs-model-a">--</span>
      <span class="cs-session" id="cs-session-a"></span>
      <span class="cs-stat" id="cs-turns-a"></span>
      <span class="cs-stat" id="cs-cost-a"></span>
      <span class="cs-stat" id="cs-duration-a"></span>
    </div>
  </div>
  <div class="column" id="col-b">
    <div class="col-header">
      <div>
        <div class="model-name" id="label-b">模型 B</div>
        <div class="session-info" id="session-b"></div>
      </div>
      <div class="col-stats" id="stats-b"></div>
    </div>
    <div class="messages" id="messages-b"></div>
    <div class="col-status-bar" id="status-bar-b">
      <span class="cs-model" id="cs-model-b">--</span>
      <span class="cs-session" id="cs-session-b"></span>
      <span class="cs-stat" id="cs-turns-b"></span>
      <span class="cs-stat" id="cs-cost-b"></span>
      <span class="cs-stat" id="cs-duration-b"></span>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-col" id="input-col-a">
    <div class="input-row">
      <div class="input-wrapper">
        <div id="autocomplete-a" class="autocomplete-dropdown hidden"></div>
        <textarea id="input-a" placeholder="输入消息..." rows="1"></textarea>
      </div>
      <button class="send-btn" data-side="A" onclick="sendMessage('A')">发送</button>
    </div>
  </div>
  <div class="input-col" id="input-col-b">
    <div class="input-row">
      <div class="input-wrapper">
        <div id="autocomplete-b" class="autocomplete-dropdown hidden"></div>
        <textarea id="input-b" placeholder="输入消息..." rows="1"></textarea>
      </div>
      <button class="send-btn" data-side="B" onclick="sendMessage('B')">发送</button>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <div class="left">
    <button id="send-both-btn" onclick="sendMessageToBoth()">同时发送</button>
    <span class="turn-info">轮次: <strong id="turn-count">0</strong></span>
  </div>
  <div class="right" style="display:flex;gap:8px;align-items:center;">
    <button class="submit-side-btn" id="submit-a-btn" onclick="submitSide('A')" style="background:transparent;color:var(--a-accent);border:1px solid var(--a-accent);border-radius:var(--radius);padding:6px 14px;font-size:13px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='var(--a-accent)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='var(--a-accent)'">提交 A</button>
    <button class="submit-side-btn" id="submit-b-btn" onclick="submitSide('B')" style="background:transparent;color:var(--b-accent);border:1px solid var(--b-accent);border-radius:var(--radius);padding:6px 14px;font-size:13px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='var(--b-accent)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='var(--b-accent)'">提交 B</button>
    <button id="end-btn" onclick="endEval()">结束评测</button>
  </div>
</div>
<div class="shortcut-bar open" id="shortcut-bar">
  <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 同时发送</span>
  <span><kbd>Ctrl</kbd>+<kbd>H</kbd> 历史面板</span>
  <span><kbd>Ctrl</kbd>+<kbd>K</kbd> 聚焦输入</span>
  <span><kbd>Ctrl</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> 切换输入框</span>
  <span><kbd>Esc</kbd> 清空输入</span>
</div>
</div><!-- /main-area -->
</div>

<script>
const $ = (s) => document.querySelector(s);

// ─── State ─────────────────────────────────────────────────────────────
let turnCount = 0;
let startTime = null;
let timerInterval = null;
let waitingForResponse = { A: false, B: false };
let isSending = { A: false, B: false };
let currentEvalId = null;
let viewingHistoryId = null; // null = live mode, string = viewing past eval
let sideCliType = { A: "claude", B: "claude" }; // track CLI type per side

// Per-side streaming state
const sideState = {
  A: { currentAssistantEl: null, currentTextEl: null, toolBlocks: {} },
  B: { currentAssistantEl: null, currentTextEl: null, toolBlocks: {} },
};

// Message history collection (for saving)
const messageHistory = { A: [], B: [] };
// Current assistant message being built (for history)
const currentMsg = { A: null, B: null };

// ─── Local draft persistence (survives page refresh) ───────────────────
// The server only persists history at eval_ended, so a mid-eval refresh would
// otherwise wipe the transcript. We mirror messageHistory into localStorage on
// every change, keyed by evalId, and restore + re-render it on reconnect.
const DRAFT_KEY = "mimo_eval_draft";
function persistDraft() {
  if (!currentEvalId || viewingHistoryId) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      evalId: currentEvalId,
      modelA: $("#label-a").textContent.replace("⬤ ", ""),
      modelB: $("#label-b").textContent.replace("⬤ ", ""),
      turnCount,
      startTime,
      messages: messageHistory,
    }));
  } catch {}
}
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch {} }
function loadDraft(evalId) {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d && d.evalId === evalId ? d : null;
  } catch { return null; }
}

// Render a saved transcript (messageHistory shape) into the live columns.
function renderTranscript(messages) {
  for (const side of ["A", "B"]) {
    const container = $(`#messages-${side.toLowerCase()}`);
    container.innerHTML = "";
    for (const msg of (messages?.[side] || [])) {
      if (msg.role === "user") {
        const el = document.createElement("div");
        el.className = "msg-user";
        const lbl = document.createElement("div");
        lbl.className = "label";
        lbl.textContent = "你";
        el.appendChild(lbl);
        el.appendChild(createUserBubble(msg.text));
        container.appendChild(el);
      } else if (msg.role === "assistant") {
        const el = document.createElement("div");
        el.className = "msg-assistant";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        for (const block of (msg.blocks || [])) {
          if (block.type === "thinking") {
            const t = document.createElement("div");
            t.className = "thinking-block";
            t.textContent = block.text;
            t.onclick = () => t.classList.toggle("expanded");
            bubble.appendChild(t);
          } else if (block.type === "text") {
            const s = document.createElement("div");
            s.className = "text-block md";
            s.innerHTML = renderMarkdown(block.text || "");
            bubble.appendChild(s);
          } else if (block.type === "tool_use") {
            bubble.appendChild(createToolCallEl(block));
          }
        }
        if (msg.result) {
          const footer = document.createElement("div");
          footer.className = "result-footer";
          const parts = [];
          if (msg.result.num_turns) parts.push(`${msg.result.num_turns} turns`);
          if (msg.result.total_cost_usd) parts.push(`$${msg.result.total_cost_usd.toFixed(4)}`);
          if (parts.length) footer.textContent = parts.join(" · ");
          bubble.appendChild(footer);
        }
        el.appendChild(bubble);
        container.appendChild(el);
      }
    }
    container.scrollTop = container.scrollHeight;
  }
}

// ─── SSE ───────────────────────────────────────────────────────────────
const sse = new EventSource("/events");
sse.onopen = () => { $("#status-dot").className = "status-dot connected"; $("#status-text").textContent = "已连接"; };
sse.onerror = () => { $("#status-dot").className = "status-dot disconnected"; $("#status-text").textContent = "连接断开"; };
sse.onmessage = (e) => handleEvent(JSON.parse(e.data));

function handleEvent(data) {
  switch (data.type) {
    case "eval_started":
      currentEvalId = data.evalId || null;
      $("#label-a").textContent = "⬤ " + data.modelA;
      $("#label-b").textContent = "⬤ " + data.modelB;
      if (data.sessionA) $("#session-a").textContent = "Session: " + data.sessionA.slice(0, 8);
      if (data.sessionB) $("#session-b").textContent = "Session: " + data.sessionB.slice(0, 8);
      // Track CLI types for slash command filtering
      if (data.modelA && data.modelA.toLowerCase().includes("mimo")) sideCliType.A = "mimocode";
      if (data.modelB && data.modelB.toLowerCase().includes("mimo")) sideCliType.B = "mimocode";
      // Update title for agent mode
      if (sideCliType.A === "mimocode" || sideCliType.B === "mimocode") {
        document.title = "Agent 评测 — " + (data.taskName || "Claude Code vs MimoCode");
        $("header h1").textContent = "Agent 评测";
      } else {
        document.title = "MiMo AB 评测 — " + (data.taskName || "");
      }
      // Status bars
      $("#cs-model-a").textContent = data.modelA;
      $("#cs-model-b").textContent = data.modelB;
      if (data.sessionA) $("#cs-session-a").textContent = data.sessionA.slice(0, 8);
      if (data.sessionB) $("#cs-session-b").textContent = data.sessionB.slice(0, 8);
      startTime = Date.now();
      // Restore transcript from a pre-refresh draft for this same eval
      {
        const draft = loadDraft(currentEvalId);
        if (draft) {
          messageHistory.A = draft.messages?.A || [];
          messageHistory.B = draft.messages?.B || [];
          turnCount = draft.turnCount || turnCount;
          $("#turn-count").textContent = turnCount;
          if (draft.startTime) startTime = draft.startTime;
          renderTranscript(draft.messages);
        }
      }
      timerInterval = setInterval(updateTimer, 1000);
      loadHistoryList();
      break;
    case "first_message":
      // Display injected first message as user bubble in both columns
      if (data.text) {
        appendUser("A", data.text);
        appendUser("B", data.text);
        messageHistory.A.push({ role: "user", text: data.text });
        messageHistory.B.push({ role: "user", text: data.text });
        turnCount++;
        $("#turn-count").textContent = turnCount;
        persistDraft();
      }
      break;
    case "stream_event":
      handleStreamEvent(data.side, data.event);
      break;
    case "eval_ended":
      clearInterval(timerInterval);
      document.querySelectorAll(".send-btn").forEach(b => b.disabled = true);
      document.querySelectorAll(".input-col textarea").forEach(i => i.disabled = true);
      $("#send-both-btn").disabled = true;
      appendSystem("both", "评测已结束，数据已提交。");
      saveHistory();
      clearDraft();
      // Show result dialog
      setTimeout(() => {
        if (currentEvalId && confirm("评测已提交！\n\n是否查看评测详情？")) {
          const routerBase = "http://mimorouter.llmcore.ai.srv";
          window.open(`${routerBase}/evaluation/detail/${currentEvalId}`, "_blank");
        }
      }, 500);
      break;
  }
}

// ─── Stream Event Handler ──────────────────────────────────────────────
function handleStreamEvent(side, event) {
  const container = $(`#messages-${side.toLowerCase()}`);
  const state = sideState[side];

  if (event.type === "assistant") {
    const content = event.message?.content || [];
    // Track for history
    if (!currentMsg[side]) currentMsg[side] = { role: "assistant", blocks: [] };
    for (const block of content) {
      if (block.type === "thinking") {
        appendThinking(state, container, block.thinking);
        // Merge consecutive thinking deltas into the last thinking block
        const last = currentMsg[side].blocks[currentMsg[side].blocks.length - 1];
        if (last && last.type === "thinking") last.text += block.thinking;
        else currentMsg[side].blocks.push({ type: "thinking", text: block.thinking });
      } else if (block.type === "text") {
        appendText(state, container, block.text, event.error);
        // Merge consecutive text deltas into the last text block (streaming arrives char-by-char)
        const last = currentMsg[side].blocks[currentMsg[side].blocks.length - 1];
        if (last && last.type === "text") last.text += block.text;
        else currentMsg[side].blocks.push({ type: "text", text: block.text });
      } else if (block.type === "tool_use") {
        startToolBlock(state, container, block);
        currentMsg[side].blocks.push({ type: "tool_use", name: block.name, input: block.input, id: block.id });
      }
    }
  }

  if (event.type === "user") {
    const content = event.message?.content || [];
    for (const block of content) {
      if (block.type === "tool_result") {
        finishToolBlock(state, block.tool_use_id, block.content, block.is_error);
        if (currentMsg[side]) {
          currentMsg[side].blocks.push({ type: "tool_result", tool_use_id: block.tool_use_id, content: typeof block.content === "string" ? block.content.slice(0, 2000) : JSON.stringify(block.content).slice(0, 2000), is_error: block.is_error });
        }
      }
    }
  }

  if (event.type === "result") {
    finishResult(side, container, state, event);
  }

  container.scrollTop = container.scrollHeight;
}

// ─── Rendering: Thinking ───────────────────────────────────────────────
function appendThinking(state, container, text) {
  ensureAssistantMessage(state, container);
  const bubble = state.currentAssistantEl.querySelector(".bubble");
  let thinkEl = state.currentAssistantEl.querySelector(".thinking-block");
  if (!thinkEl) {
    thinkEl = document.createElement("div");
    thinkEl.className = "thinking-block";
    thinkEl.onclick = () => thinkEl.classList.toggle("expanded");
    bubble.insertBefore(thinkEl, bubble.firstChild);
  }
  thinkEl.textContent += text;
}

// ─── Rendering: Text ───────────────────────────────────────────────────
function appendText(state, container, text, isError) {
  ensureAssistantMessage(state, container);
  const bubble = state.currentAssistantEl.querySelector(".bubble");
  bubble.classList.remove("hidden");
  const errored = isError || text?.startsWith("API Error:");
  if (!state.currentTextEl) {
    state.currentTextEl = document.createElement("div");
    state.currentTextEl.className = "text-block" + (errored ? " error" : " md");
    state.currentTextEl._raw = "";
    bubble.appendChild(state.currentTextEl);
  }
  state.currentTextEl._raw += text;
  // Errors stay plain; normal text renders as markdown
  if (state.currentTextEl.classList.contains("error")) {
    state.currentTextEl.textContent = state.currentTextEl._raw;
  } else {
    state.currentTextEl.innerHTML = renderMarkdown(state.currentTextEl._raw);
  }
}

// ─── Rendering: Tool Call ──────────────────────────────────────────────
function startToolBlock(state, container, block) {
  ensureAssistantMessage(state, container);
  const bubble = state.currentAssistantEl.querySelector(".bubble");
  bubble.classList.remove("hidden");

  // A tool call ends the current text run; subsequent text starts a fresh block
  state.currentTextEl = null;

  const el = createToolCallEl(block);
  el.dataset.toolId = block.id;
  bubble.appendChild(el);
  state.toolBlocks[block.id] = { block: el };
}

function finishToolBlock(state, toolUseId, content, isError) {
  const tb = state.toolBlocks[toolUseId];
  if (!tb) return;

  const displayContent = typeof content === "string" ? content : JSON.stringify(content, null, 2);
  if (!displayContent) return;

  const resultEl = tb.block.querySelector(".tool-result");
  if (!resultEl) return;

  resultEl.className = `tool-result ${isError ? "error" : "success"}`;
  const truncated = displayContent.length > 500;
  const preview = truncated ? displayContent.slice(0, 500) + "\n..." : displayContent;
  const lines = displayContent.split("\n").length;
  const summary = isError ? "✗ 失败" : `✓ 成功 · ${lines}行 · ${displayContent.length}字符`;

  resultEl.innerHTML = `
    <span>${summary}</span>
    <span class="tool-result-toggle" onclick="this.parentElement.classList.toggle('expanded')"> · 展开</span>
    <div class="tool-result-content">${escapeHtml(preview)}</div>
  `;
}

// ─── Rendering: Result ─────────────────────────────────────────────────
function finishResult(side, container, state, event) {
  waitingForResponse[side] = false;
  updateSendButton();
  removeWaiting(container);

  // Finalize history message
  if (currentMsg[side]) {
    currentMsg[side].result = {
      num_turns: event.num_turns,
      total_cost_usd: event.total_cost_usd,
      duration_ms: event.duration_ms,
      subtype: event.subtype,
    };
    messageHistory[side].push(currentMsg[side]);
    currentMsg[side] = null;
    persistDraft();
  }

  // Add result footer with cost/turns
  if (state.currentAssistantEl) {
    const bubble = state.currentAssistantEl.querySelector(".bubble");
    const footer = document.createElement("div");
    footer.className = "result-footer";
    const parts = [];
    if (event.num_turns) parts.push(`${event.num_turns} turns`);
    if (event.total_cost_usd) parts.push(`$${event.total_cost_usd.toFixed(4)}`);
    if (event.subtype) parts.push(event.subtype);
    if (parts.length) {
      footer.textContent = parts.join(" · ");
      bubble.appendChild(footer);
    }
  }

  // Update stats
  updateStats(side, event);

  resetState(state);
}

function updateStats(side, event) {
  const statsEl = $(`#stats-${side.toLowerCase()}`);
  const parts = [];
  if (event.num_turns) parts.push(`<span>🔄 ${event.num_turns}</span>`);
  if (event.total_cost_usd) parts.push(`<span>💰 $${event.total_cost_usd.toFixed(4)}</span>`);
  if (event.duration_ms) parts.push(`<span>⏱ ${(event.duration_ms / 1000).toFixed(1)}s</span>`);
  statsEl.innerHTML = parts.join("");

  // Update per-column status bar
  const s = side.toLowerCase();
  if (event.num_turns) $(`#cs-turns-${s}`).textContent = `🔄 ${event.num_turns}`;
  if (event.total_cost_usd) $(`#cs-cost-${s}`).textContent = `💰 $${event.total_cost_usd.toFixed(4)}`;
  if (event.duration_ms) $(`#cs-duration-${s}`).textContent = `⏱ ${(event.duration_ms / 1000).toFixed(1)}s`;
}

// ─── Assistant Message Lifecycle ───────────────────────────────────────
function ensureAssistantMessage(state, container) {
  if (state.currentAssistantEl) return;
  state.currentAssistantEl = document.createElement("div");
  state.currentAssistantEl.className = "msg-assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble hidden";
  state.currentAssistantEl.appendChild(bubble);
  container.appendChild(state.currentAssistantEl);
}

function resetState(state) {
  state.currentAssistantEl = null;
  state.currentTextEl = null;
  state.toolBlocks = {};
}

// ─── Tool Icons ─────────────────────────────────────────────────────
function getToolIcon(name) {
  const icons = {
    Read: "📄", Write: "✏️", Edit: "📝", Bash: "💻", Glob: "🔍",
    Grep: "🔎", Agent: "🤖", WebFetch: "🌐", WebSearch: "🔮",
    TodoRead: "📋", TodoWrite: "✅", NotebookEdit: "📓",
    mcp__feishu_mcp_pro__doc_read: "📄", mcp__feishu_mcp_pro__doc_write: "✏️",
  };
  // Match case-insensitively so MimoCode's lowercase tool names (e.g. "bash") get icons too
  if (icons[name]) return icons[name];
  const lower = (name || "").toLowerCase();
  for (const k in icons) { if (k.toLowerCase() === lower) return icons[k]; }
  return "⚙️";
}

// ─── Tool Call Element ─────────────────────────────────────────────────
function createToolCallEl(block) {
  const el = document.createElement("div");
  el.className = "tool-call";

  const input = block.input || {};
  const argsStr = summarizeToolInput(block.name, input);
  const icon = getToolIcon(block.name);

  const bodyHtml = formatJsonHtml(JSON.stringify(input, null, 2));

  el.innerHTML = `
    <div class="tool-header" onclick="this.parentElement.classList.toggle('expanded')">
      <span class="tool-icon">${icon}</span>
      <span class="tool-name">${escapeHtml(block.name)}</span>
      <span class="tool-args">${escapeHtml(argsStr)}</span>
    </div>
    <div class="tool-body">${bodyHtml}</div>
    <div class="tool-result pending">⏳ 执行中...</div>
  `;
  return el;
}

function summarizeToolInput(name, input) {
  if (!input) return "";
  // Collapse newlines/extra whitespace so multi-line commands (heredocs) stay single-line
  const oneLine = (s) => String(s || "").replace(/\s+/g, " ").trim();
  const clip = (s, n) => { s = oneLine(s); return s.length > n ? s.slice(0, n) + "…" : s; };
  const n = (name || "").toLowerCase();
  if (n === "read" || n === "write" || n === "edit") return clip(input.file_path, 80);
  if (n === "bash") return clip(input.command, 80);
  if (n === "glob" || n === "grep") return clip(input.pattern || input.query, 80);
  return clip(JSON.stringify(input), 80);
}

// ─── JSON Syntax Highlighting ──────────────────────────────────────────
function formatJsonHtml(text) {
  try {
    const parsed = JSON.parse(text);
    const formatted = JSON.stringify(parsed, null, 2);
    return highlightJson(escapeHtml(formatted));
  } catch { return escapeHtml(text); }
}

function highlightJson(escaped) {
  return escaped.replace(
    /("(?:\\.|[^"\\])*")\s*(:)?|(\b(?:true|false)\b)|(\bnull\b)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (match, str, colon, bool, nil, num) => {
      if (str) {
        if (colon) return `<span class="json-key">${str}</span>:`;
        return `<span class="json-string">${str}</span>`;
      }
      if (bool) return `<span class="json-boolean">${bool}</span>`;
      if (nil) return `<span class="json-null">${nil}</span>`;
      if (num) return `<span class="json-number">${num}</span>`;
      return match;
    }
  );
}

// ─── User Message (with long output detection) ─────────────────────────
function createUserBubble(text) {
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const isLong = text.includes("\n") && text.length > 150;
  if (isLong) {
    const preview = document.createElement("div");
    preview.className = "user-preview";
    const firstLine = text.split("\n")[0];
    preview.textContent = firstLine.length > 80 ? firstLine.slice(0, 80) + "..." : firstLine;
    bubble.appendChild(preview);

    const toggle = document.createElement("span");
    toggle.className = "user-toggle";
    toggle.textContent = "展开完整输出";
    bubble.appendChild(toggle);

    const fullBlock = document.createElement("pre");
    fullBlock.className = "user-full-output";
    fullBlock.textContent = text;
    bubble.appendChild(fullBlock);

    toggle.onclick = () => {
      const isOpen = fullBlock.classList.toggle("open");
      toggle.textContent = isOpen ? "收起" : "展开完整输出";
    };
  } else {
    bubble.textContent = text;
  }
  return bubble;
}

// ─── Waiting Spinner ───────────────────────────────────────────────────
function showWaiting(side) {
  const container = $(`#messages-${side.toLowerCase()}`);
  const el = document.createElement("div");
  el.className = "waiting waiting-spinner";
  el.innerHTML = `<span class="spinner"></span> 思考中...`;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function removeWaiting(container) {
  container.querySelectorAll(".waiting-spinner").forEach(w => w.remove());
}

function appendSystem(side, text) {
  const containers = side === "both"
    ? [$("#messages-a"), $("#messages-b")]
    : [$(`#messages-${side.toLowerCase()}`)];
  for (const c of containers) {
    const el = document.createElement("div");
    el.className = "system-msg";
    el.textContent = text;
    c.appendChild(el);
    c.scrollTop = c.scrollHeight;
  }
}

// Styled command result (like claude-web-ui's appendAssistantText)
function appendCommandResult(side, header, htmlContent) {
  const container = $(`#messages-${side.toLowerCase()}`);
  const el = document.createElement("div");
  el.className = "cmd-result";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const headerEl = document.createElement("div");
  headerEl.className = "cmd-header";
  headerEl.textContent = header;
  bubble.appendChild(headerEl);
  const contentEl = document.createElement("div");
  contentEl.innerHTML = htmlContent;
  bubble.appendChild(contentEl);
  el.appendChild(bubble);
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

// ─── Send Messages ─────────────────────────────────────────────────────
async function sendMessage(side) {
  if (isSending[side]) return;
  isSending[side] = true;

  const input = $(`#input-${side.toLowerCase()}`);
  const text = input.value.trim();
  if (!text) { isSending[side] = false; return; }

  // Clear input (may already be cleared by keydown handler for slash commands)
  input.value = "";
  autoResize(input);
  turnCount++;
  $("#turn-count").textContent = turnCount;

  // Show user message
  const container = $(`#messages-${side.toLowerCase()}`);
  const el = document.createElement("div");
  el.className = "msg-user";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "你";
  el.appendChild(label);
  el.appendChild(createUserBubble(text));
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;

  // Track in history
  messageHistory[side].push({ role: "user", text });
  persistDraft();

  waitingForResponse[side] = true;
  showWaiting(side);
  updateSendButton();

  await fetch("/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, side }),
  });
  isSending[side] = false;
}

async function sendMessageToBoth() {
  const inputA = $("#input-a");
  const inputB = $("#input-b");
  const textA = inputA.value.trim();
  const textB = inputB.value.trim();
  const text = textA || textB;
  if (!text) return;

  inputA.value = ""; inputB.value = "";
  autoResize(inputA); autoResize(inputB);

  turnCount++;
  $("#turn-count").textContent = turnCount;

  for (const side of ["A", "B"]) {
    const container = $(`#messages-${side.toLowerCase()}`);
    const el = document.createElement("div");
    el.className = "msg-user";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "你";
    el.appendChild(label);
    el.appendChild(createUserBubble(text));
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;

    messageHistory[side].push({ role: "user", text });
    persistDraft();

    waitingForResponse[side] = true;
    showWaiting(side);
    isSending[side] = true;

    await fetch("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, side }),
    });
    isSending[side] = false;
  }
  updateSendButton();
}

function updateSendButton() {
  document.querySelectorAll(".send-btn").forEach(btn => {
    const side = btn.dataset.side;
    btn.disabled = waitingForResponse[side] || isSending[side];
  });
}

// ─── Timer ─────────────────────────────────────────────────────────────
function updateTimer() {
  if (!startTime) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const s = String(elapsed % 60).padStart(2, "0");
  $("#timer").textContent = `${m}:${s}`;
}

// ─── Submit Side ──────────────────────────────────────────────────────
const submittedSides = { A: false, B: false };

// 采集评分：绝不预填默认值。用户取消采用情况 → 返回 null（中止）；
// 留空/非法 → 如实记为「未评分」（adoption=''、rating=0、output_rating=0），绝不伪造。
function collectRatings(prefix) {
  const adoptionRaw = prompt(`${prefix}是否采用了代码产出？\n1 = 采用  2 = 部分采用  3 = 未采用\n（留空 = 未评分，不计分；取消 = 放弃本次提交）`, "");
  if (adoptionRaw === null) return null; // 取消 → 中止
  const ratingRaw = prompt(`${prefix}体感打分 1-5（交互流畅度 / 理解力 / 是否反复纠正）\n（留空 = 未评分）`, "");
  const outputRaw = prompt(`${prefix}效果打分 1-5（代码正确性 / 完整性 / 可用性）\n（留空 = 未评分）`, "");
  const feedback = (prompt(`${prefix}补充反馈（可选，直接确定跳过）:`, "") || "").trim();
  const adoptionMap = { "1": "adopted", "2": "partial", "3": "rejected" };
  const r = parseInt(ratingRaw, 10);
  const o = parseInt(outputRaw, 10);
  return {
    adoption: adoptionMap[(adoptionRaw || "").trim()] || "",
    rating: (r >= 1 && r <= 5) ? r : 0,
    output_rating: (o >= 1 && o <= 5) ? o : 0,
    feedback,
  };
}

async function submitSide(side) {
  if (submittedSides[side]) {
    if (!confirm(`Side ${side} 已提交过，确定重新提交？\n（服务端将重新打分）`)) return;
  }

  const fb = collectRatings(`[Side ${side}] `);
  if (fb === null) return; // 用户取消

  try {
    const resp = await fetch("/submit-side", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        side,
        adoption: fb.adoption,
        rating: fb.rating,
        output_rating: fb.output_rating,
        feedback: fb.feedback,
        resubmit: submittedSides[side],
      }),
    });
    if (resp.ok) {
      submittedSides[side] = true;
      const btn = $(`#submit-${side.toLowerCase()}-btn`);
      btn.textContent = `✓ ${side} 已提交（可重提）`;
      btn.style.opacity = "0.5";
      appendSystem(side, `Side ${side} 评测结果已提交`);

      // If both sides submitted, auto-end
      if (submittedSides.A && submittedSides.B) {
        appendSystem("both", "双侧均已提交，评测结束！");
        setTimeout(() => endEval(true), 500);
      }
    } else {
      alert(`提交失败: HTTP ${resp.status}`);
    }
  } catch (err) {
    alert(`提交失败: ${err.message}`);
  }
}

// ─── End Eval ──────────────────────────────────────────────────────────
async function endEval(skipConfirm = false) {
  if (!skipConfirm && !confirm("确定结束评测？")) return;

  // If sides haven't been submitted individually, collect combined feedback
  if (!submittedSides.A && !submittedSides.B) {
    const fb = collectRatings("");
    await fetch("/end", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // 取消评分 → 仍结束，但不带评分（fb 为 null 时发空对象，后端不会伪造）
      body: JSON.stringify(fb || {}),
    });
  } else {
    await fetch("/end", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  }
}

// ─── Helpers ───────────────────────────────────────────────────────────
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ─── Lightweight Markdown Renderer ──────────────────────────────────
// Self-contained (no external lib). Escapes first, then applies block + inline rules.
// Good enough for assistant output: headings, lists, code fences, inline code,
// bold/italic, links, blockquotes, hr, tables.
function renderMarkdown(src) {
  if (!src) return "";
  // Extract fenced code blocks first so their content isn't touched by other rules
  const codeBlocks = [];
  let s = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`);
    return `␀CB${i}␀`;
  });

  s = escapeHtml(s);

  // Inline rules (applied per-segment, not inside code blocks)
  const inline = (t) => t
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = s.split("\n");
  const out = [];
  let i = 0;
  let listType = null; // 'ul' | 'ol'
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

  while (i < lines.length) {
    const line = lines[i];
    // Code block placeholder
    let m = line.match(/^␀CB(\d+)␀$/);
    if (m) { closeList(); out.push(codeBlocks[+m[1]]); i++; continue; }
    // Heading
    m = line.match(/^(#{1,3})\s+(.*)$/);
    if (m) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    // Horizontal rule
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); out.push("<hr>"); i++; continue; }
    // Blockquote
    if (/^&gt;\s?/.test(line)) { closeList(); out.push(`<blockquote>${inline(line.replace(/^&gt;\s?/, ""))}</blockquote>`); i++; continue; }
    // Table (header row + separator)
    if (/^\|.*\|/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|/.test(lines[i + 1])) {
      closeList();
      const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(line), rows = [];
      i += 2;
      while (i < lines.length && /^\|.*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      let tbl = "<table><thead><tr>" + head.map((h) => `<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) tbl += "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out.push(tbl + "</tbody></table>");
      continue;
    }
    // Unordered list
    m = line.match(/^[-*+]\s+(.*)$/);
    if (m) { if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; } out.push(`<li>${inline(m[1])}</li>`); i++; continue; }
    // Ordered list
    m = line.match(/^\d+\.\s+(.*)$/);
    if (m) { if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; } out.push(`<li>${inline(m[1])}</li>`); i++; continue; }
    // Blank line
    if (/^\s*$/.test(line)) { closeList(); i++; continue; }
    // Paragraph (merge consecutive non-blank lines)
    closeList();
    const para = [line];
    i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|[-*+]\s|\d+\.\s|&gt;|␀CB|\||-{3,}|\*{3,})/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push(`<p>${inline(para.join("<br>"))}</p>`);
  }
  closeList();
  return out.join("\n");
}

// MimoCode side: only init and review are built-in commands
const MIMO_SLASH_COMMANDS = [
  { name: "clear", desc: "清空消息", icon: "🧹" },
  { name: "init", desc: "初始化项目", icon: "🚀" },
  { name: "review", desc: "代码审查", icon: "🔍" },
];

// Autocomplete state per side
const acState = { A: { items: [], index: 0, mode: null }, B: { items: [], index: 0, mode: null } };

function showSlashAutocomplete(side, query) {
  const cmds = (sideCliType[side] === "mimocode") ? MIMO_SLASH_COMMANDS : SLASH_COMMANDS;
  const filtered = cmds.filter(c => c.name.startsWith(query.toLowerCase()));
  if (filtered.length === 0) { hideAutocomplete(side); return; }

  const ac = acState[side];
  ac.mode = "slash";
  ac.items = filtered;
  ac.index = 0;
  renderAutocomplete(side, query);
}

function renderAutocomplete(side, highlight) {
  const dropdown = $(`#autocomplete-${side.toLowerCase()}`);
  const ac = acState[side];
  dropdown.innerHTML = "";

  ac.items.forEach((item, i) => {
    const el = document.createElement("div");
    el.className = "autocomplete-item" + (i === ac.index ? " selected" : "");
    el.innerHTML = `
      <span class="ac-icon">${item.icon}</span>
      <span class="ac-cmd">/${highlightMatch(item.name, highlight)}</span>
      <span class="ac-desc">${item.desc}</span>
    `;
    el.onclick = () => { ac.index = i; acSelect(side); };
    el.onmouseenter = () => {
      dropdown.querySelectorAll(".selected").forEach(s => s.classList.remove("selected"));
      el.classList.add("selected");
      ac.index = i;
    };
    dropdown.appendChild(el);
  });

  dropdown.classList.remove("hidden");
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx)) + "<mark>" + escapeHtml(text.slice(idx, idx + query.length)) + "</mark>" + escapeHtml(text.slice(idx + query.length));
}

function acMove(side, dir) {
  const ac = acState[side];
  ac.index = (ac.index + dir + ac.items.length) % ac.items.length;
  const dropdown = $(`#autocomplete-${side.toLowerCase()}`);
  dropdown.querySelectorAll(".autocomplete-item").forEach((el, i) => {
    el.classList.toggle("selected", i === ac.index);
  });
  const selected = dropdown.querySelector(".selected");
  if (selected) selected.scrollIntoView({ block: "nearest" });
}

function acSelect(side) {
  const input = $(`#input-${side.toLowerCase()}`);
  const ac = acState[side];
  const item = ac.items[ac.index];
  if (ac.mode === "slash") {
    input.value = "/" + item.name + " ";
    hideAutocomplete(side);
    input.focus();
  }
}

function hideAutocomplete(side) {
  const ac = acState[side];
  ac.mode = null;
  ac.items = [];
  ac.index = 0;
  const dropdown = $(`#autocomplete-${side.toLowerCase()}`);
  if (dropdown) dropdown.classList.add("hidden");
}

  // Unknown command → forward as regular message

// ─── Input History ──────────────────────────────────────────────────
let inputHistory = JSON.parse(localStorage.getItem("mimo_eval_history") || "[]");
const historyNav = { A: { index: -1, draft: "" }, B: { index: -1, draft: "" } };

function saveToHistory(text) {
  if (!text.trim()) return;
  if (inputHistory.length > 0 && inputHistory[inputHistory.length - 1] === text) return;
  inputHistory.push(text);
  if (inputHistory.length > 200) inputHistory = inputHistory.slice(-200);
  localStorage.setItem("mimo_eval_history", JSON.stringify(inputHistory));
}

function navigateHistory(side, direction) {
  const input = $(`#input-${side.toLowerCase()}`);
  const nav = historyNav[side];

  if (nav.index === -1) nav.draft = input.value;
  nav.index += direction;
  if (nav.index < -1) nav.index = -1;
  if (nav.index >= inputHistory.length) nav.index = inputHistory.length - 1;

  if (nav.index === -1) {
    input.value = nav.draft;
  } else {
    input.value = inputHistory[inputHistory.length - 1 - nav.index];
  }
  autoResize(input);
  setTimeout(() => { input.selectionStart = input.selectionEnd = input.value.length; }, 0);
}

// ─── Input Handling ────────────────────────────────────────────────────
document.querySelectorAll(".input-col textarea").forEach(textarea => {
  const side = textarea.id === "input-a" ? "A" : "B";

  textarea.addEventListener("input", () => {
    autoResize(textarea);
    const text = textarea.value;
    if (text.startsWith("/")) {
      showSlashAutocomplete(side, text.slice(1));
    } else {
      hideAutocomplete(side);
    }
  });

  textarea.addEventListener("keydown", (e) => {
    const ac = acState[side];

    // Autocomplete navigation (Arrow keys + Tab)
    if (ac.mode) {
      if (e.key === "ArrowDown") { e.preventDefault(); acMove(side, 1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); acMove(side, -1); return; }
      if (e.key === "Tab") {
        if (ac.items.length > 0) {
          e.preventDefault();
          acSelect(side);
          return;
        }
      }
      if (e.key === "Escape") { hideAutocomplete(side); e.preventDefault(); return; }
      // Enter with autocomplete open → select first, then close & let it fall through to send
      if (e.key === "Enter" && !e.shiftKey) {
        if (ac.items.length > 0) {
          e.preventDefault();
          acSelect(side); // fills input with "/command "
          hideAutocomplete(side);
          // Now trigger send immediately
          setTimeout(() => {
            const text = textarea.value.trim();
            if (text.startsWith("/")) {
              const handled = handleSlashCommand(side, text);
              textarea.value = "";
              autoResize(textarea);
              historyNav[side].index = -1;
              $(`#messages-${side.toLowerCase()}`).scrollTop = $(`#messages-${side.toLowerCase()}`).scrollHeight;
              if (handled) return;
            }
            sendMessage(side);
          }, 0);
          return;
        }
      }
    }

    // Send on Enter (no autocomplete active)
    if (e.key === "Enter" && !e.shiftKey && !ac.mode) {
      e.preventDefault();

      // Handle slash commands locally
      const text = textarea.value.trim();
      if (text.startsWith("/")) {
        const handled = handleSlashCommand(side, text);
        textarea.value = "";
        autoResize(textarea);
        historyNav[side].index = -1;
        $(`#messages-${side.toLowerCase()}`).scrollTop = $(`#messages-${side.toLowerCase()}`).scrollHeight;
        if (handled) return;
        // Unknown command → send as regular message
        sendMessage(side);
        return;
      }

      saveToHistory(text);
      historyNav[side].index = -1;
      sendMessage(side);
      return;
    }

    // Input history (up/down when input empty or navigating)
    if (e.key === "ArrowUp" && !ac.mode) {
      if (textarea.value === "" || historyNav[side].index >= 0) {
        e.preventDefault();
        navigateHistory(side, -1);
        return;
      }
    }
    if (e.key === "ArrowDown" && !ac.mode) {
      if (historyNav[side].index >= 0) {
        e.preventDefault();
        navigateHistory(side, 1);
        return;
      }
    }
  });
});

// Close autocomplete when clicking outside
document.addEventListener("click", (e) => {
  if (!e.target.closest(".autocomplete-dropdown") && !e.target.closest("textarea")) {
    hideAutocomplete("A");
    hideAutocomplete("B");
  }
});

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ─── History: Save ──────────────────────────────────────────────────
async function saveHistory() {
  if (!currentEvalId) return;
  try {
    await fetch("/save-history", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        evalId: currentEvalId,
        taskName: $("#label-a").textContent.replace("⬤ ", "") + " vs " + $("#label-b").textContent.replace("⬤ ", ""),
        modelA: $("#label-a").textContent.replace("⬤ ", ""),
        modelB: $("#label-b").textContent.replace("⬤ ", ""),
        startedAt: startTime,
        endedAt: Date.now(),
        messages: messageHistory,
      }),
    });
    loadHistoryList();
  } catch (e) {
    console.error("Failed to save history:", e);
  }
}

// ─── History: Load List ─────────────────────────────────────────────
async function loadHistoryList() {
  try {
    const resp = await fetch("/history");
    if (!resp.ok) return;
    let items = await resp.json();

    // Add current evaluation to the list if it's not already there
    if (currentEvalId && !items.some(i => i.evalId === currentEvalId)) {
      const currentModelA = $("#label-a").textContent.replace("⬤ ", "");
      const currentModelB = $("#label-b").textContent.replace("⬤ ", "");
      items.unshift({
        evalId: currentEvalId,
        taskName: "当前评测",
        modelA: currentModelA,
        modelB: currentModelB,
        startedAt: Date.now(),
        isActive: true
      });
    }

    renderHistoryList(items);
  } catch {}
}

function renderHistoryList(items) {
  const list = $("#history-list");
  if (!items.length) {
    list.innerHTML = '<div style="color: var(--text-muted); font-size: 12px; padding: 16px; text-align: center;">暂无历史记录</div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const isActive = (item.evalId === currentEvalId || item.isActive) && !viewingHistoryId;
    const isViewing = item.evalId === viewingHistoryId;
    const date = new Date(item.startedAt);
    const dateStr = `${(date.getMonth()+1).toString().padStart(2,"0")}/${date.getDate().toString().padStart(2,"0")} ${date.getHours().toString().padStart(2,"0")}:${date.getMinutes().toString().padStart(2,"0")}`;
    const label = isActive ? '<span class="hi-label current">当前</span>' : '';
    const cls = isActive || isViewing ? 'active' : '';
    return `<div class="history-item ${cls}" data-evalid="${item.evalId}" onclick="loadHistoryDetail('${item.evalId}')">
      <div class="hi-task">${escapeHtml(item.taskName || '评测')} ${label}</div>
      <div class="hi-models">${escapeHtml(item.modelA || '')} vs ${escapeHtml(item.modelB || '')}</div>
      <div class="hi-date">${dateStr}</div>
    </div>`;
  }).join("");
}

// ─── History: Load Detail ───────────────────────────────────────────
async function loadHistoryDetail(evalId) {
  // Click on current eval → return to live mode
  if (evalId === currentEvalId) {
    viewingHistoryId = null;
    // Re-enable chat input
    document.querySelectorAll(".send-btn").forEach(b => b.disabled = false);
    document.querySelectorAll(".input-col textarea").forEach(i => { i.disabled = false; i.placeholder = "输入消息..."; });
    if ($("#send-both-btn")) $("#send-both-btn").disabled = false;
    loadHistoryList();
    return;
  }

  try {
    const resp = await fetch(`/history/${evalId}`);
    if (!resp.ok) return;
    const data = await resp.json();
    viewingHistoryId = evalId;

    // Render messages for both sides
    for (const side of ["A", "B"]) {
      const container = $(`#messages-${side.toLowerCase()}`);
      container.innerHTML = "";
      const msgs = data.messages?.[side] || [];
      for (const msg of msgs) {
        if (msg.role === "user") {
          const el = document.createElement("div");
          el.className = "msg-user";
          const lbl = document.createElement("div");
          lbl.className = "label";
          lbl.textContent = "你";
          el.appendChild(lbl);
          el.appendChild(createUserBubble(msg.text));
          container.appendChild(el);
        } else if (msg.role === "assistant") {
          const el = document.createElement("div");
          el.className = "msg-assistant";
          const bubble = document.createElement("div");
          bubble.className = "bubble";
          for (const block of (msg.blocks || [])) {
            if (block.type === "thinking") {
              const t = document.createElement("div");
              t.className = "thinking-block";
              t.textContent = block.text;
              t.onclick = () => t.classList.toggle("expanded");
              bubble.appendChild(t);
            } else if (block.type === "text") {
              const s = document.createElement("div");
              s.className = "text-block md";
              s.innerHTML = renderMarkdown(block.text || "");
              bubble.appendChild(s);
            } else if (block.type === "tool_use") {
              const tc = createToolCallEl(block);
              bubble.appendChild(tc);
            }
          }
          if (msg.result) {
            const footer = document.createElement("div");
            footer.className = "result-footer";
            const parts = [];
            if (msg.result.num_turns) parts.push(`${msg.result.num_turns} turns`);
            if (msg.result.total_cost_usd) parts.push(`$${msg.result.total_cost_usd.toFixed(4)}`);
            if (parts.length) footer.textContent = parts.join(" · ");
            bubble.appendChild(footer);
          }
          el.appendChild(bubble);
          container.appendChild(el);
        }
      }
      container.scrollTop = container.scrollHeight;
    }

    // Update header to show history info
    if (data.modelA) $("#label-a").textContent = "📋 " + data.modelA;
    if (data.modelB) $("#label-b").textContent = "📋 " + data.modelB;

    // Disable chat input when viewing history
    document.querySelectorAll(".send-btn").forEach(b => b.disabled = true);
    document.querySelectorAll(".input-col textarea").forEach(i => { i.disabled = true; i.placeholder = "查看历史记录中，不可对话"; });
    if ($("#send-both-btn")) $("#send-both-btn").disabled = true;

    loadHistoryList();
  } catch (e) {
    console.error("Failed to load history:", e);
  }
}

// ─── Sidebar Toggle ────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = $("#sidebar");
  sidebar.classList.toggle("open");
}

// ─── Shortcut Bar Toggle ───────────────────────────────────────────
function toggleShortcuts() {
  $("#shortcut-bar").classList.toggle("open");
}

// ─── Keyboard Shortcuts ────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  const isInput = e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT";
  const ctrl = e.ctrlKey || e.metaKey;

  // Ctrl+Enter → send to both
  if (ctrl && e.key === "Enter") {
    e.preventDefault();
    sendMessageToBoth();
    return;
  }

  // Ctrl+H → toggle history sidebar
  if (ctrl && e.key === "h") {
    e.preventDefault();
    toggleSidebar();
    return;
  }

  // Ctrl+K → focus first input
  if (ctrl && e.key === "k") {
    e.preventDefault();
    $("#input-a").focus();
    return;
  }

  // Ctrl+L → clear focused input
  if (ctrl && e.key === "l" && isInput) {
    e.preventDefault();
    e.target.value = "";
    autoResize(e.target);
    return;
  }

  // Ctrl+Up/Down → switch focus between inputs
  if (ctrl && e.key === "ArrowUp") {
    e.preventDefault();
    $("#input-a").focus();
    return;
  }
  if (ctrl && e.key === "ArrowDown") {
    e.preventDefault();
    $("#input-b").focus();
    return;
  }

  // Escape → clear input or close sidebar
  if (e.key === "Escape") {
    if (isInput && e.target.value) {
      e.target.value = "";
      autoResize(e.target);
    } else if ($("#sidebar").classList.contains("open")) {
      toggleSidebar();
    }
    return;
  }
});
</script>
