  - 'DOMAIN-SUFFIX,xiaomi.srv,DIRECT'
  - 'DOMAIN-SUFFIX,xiaomi.com,DIRECT'
  - 'DOMAIN-SUFFIX,xiaomi.net,DIRECT'
  - 'DOMAIN-SUFFIX,mi.com,DIRECT'
  - 'DOMAIN-SUFFIX,olap.srv,DIRECT'
  - 'DOMAIN-SUFFIX,mi-dun.com,DIRECT'
  - 'DOMAIN-SUFFIX,mitvos.com,DIRECT'
  - 'DOMAIN-SUFFIX,multica.ai,DIRECT'
  - 'DOMAIN-SUFFIX,typeless-static.com,DIRECT'

  # ============ 本地 / 私有 / 局域网 → DIRECT ============
